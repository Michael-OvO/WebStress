task_id: pp_update_insurance
env_id: patient_portal
title: Update Insurance From New Card Notice
instruction_template: 'Your Billing Department sent you a secure message with the
  subject "New Insurance Card on File" describing your new insurance card. Open that
  message and apply exactly what it states: 1) update your insurance plan name, member
  ID, and group number to the values listed on the new card, and 2) update your
  contact phone and contact email to the new contact details listed in that same
  message. An older billing message also discusses an insurance card update, but it
  is the superseded prior-period card; use only the most recent "New Insurance Card
  on File" message. Do not change your name. Do not send any messages, do not reply
  to any message, do not cancel or create appointments, do not touch any insurance
  claims, and do not modify any prescriptions, referrals, pharmacies, lab results,
  or immunization records.'
difficulty: hard
time_limit_seconds: 300
expected_steps: 14
primary_primitives:
- verification
start_path: /messages
seed:
  distractors: 8
  steps:
  - use: patient_profile
    params:
      conditions:
      - Hypertension
      - High Cholesterol
      insurance_tier: standard
    outputs:
    - pcp_id
    - pcp_name
    - insurance_plan_name
    - member_id
    - group_number
  - use: provider_directory
    params:
      count: 5
      specialties:
      - pcp
      - cardiology
      - billing
      must_include:
      - pcp
      - billing
    outputs:
    - provider_ids
    - providers_by_specialty
  - use: pharmacy_list
    params:
      count: 2
    outputs:
    - default_pharmacy_id
  - use: prescription_cabinet
    params:
      active_count: 3
    outputs:
    - active_rx_ids
  - use: appointment_history
    params:
      upcoming_count: 2
      completed_count: 2
      cancelled_count: 1
    outputs:
    - upcoming_ids
  - use: message_threads
    params:
      thread_count: 3
      unread_count: 2
      categories:
      - clinical
    outputs:
    - thread_ids
    - all_msg_ids
  - use: insurance_card_message
    params:
      stale_offset_days: 21
      current_offset_days: 1
    outputs:
    - new_plan_name
    - new_member_id
    - new_group_number
    - new_phone
    - new_email
    - stale_plan_name
    - stale_member_id
    - stale_group_number
    - current_card_msg_id
    - stale_card_msg_id
  targets:
    pcp_id: '{output.pcp_id}'
    old_plan_name: '{output.insurance_plan_name}'
    old_member_id: '{output.member_id}'
    new_plan_name: '{output.new_plan_name}'
    new_member_id: '{output.new_member_id}'
    new_group_number: '{output.new_group_number}'
    new_phone: '{output.new_phone}'
    new_email: '{output.new_email}'
    stale_plan_name: '{output.stale_plan_name}'
    stale_member_id: '{output.stale_member_id}'
    stale_group_number: '{output.stale_group_number}'
    current_card_msg_id: '{output.current_card_msg_id}'
    stale_card_msg_id: '{output.stale_card_msg_id}'
canonical_diff:
  # The authoritative new-card values are computed in the seed builder and are
  # NOT present in the instruction text — the agent must open the most-recent
  # billing message ("New Insurance Card on File"), disambiguate it from the
  # older superseded message, and extract the exact strings. Every graded
  # field is compared to a seed target via expr so the values are never
  # leaked. The patient singleton update covers insurance_plan, phone, and
  # email; all three are guarded against the stale decoy and against the
  # patient's original values, and `name` is pinned to its initial value.
  update:
    - entity: patient
      desc: Insurance and contact details updated to the new-card values from the most recent billing message
      where: { id: { any: true } }
      changes:
        insurance_plan:
          fields:
            plan_name:
              expr: "x == target['new_plan_name']"
            member_id:
              expr: "x == target['new_member_id']"
            group_number:
              expr: "x == target['new_group_number']"
        phone:
          expr: "x == target['new_phone']"
        email:
          expr: "x == target['new_email']"
        name:
          expr: "x == initial.patient.name"
  invariant:
  - collection: state.appointments
    preserve: ALL
  - collection: state.prescriptions
    preserve: ALL
  - collection: state.messages
    preserve: ALL
  - collection: state.immunizations
    preserve: ALL
  - collection: state.lab_results
    preserve: ALL
  - collection: state.claims
    preserve: ALL
  - collection: state.referrals
    preserve: ALL
  - collection: state.pharmacies
    preserve: ALL
  - collection: state.providers
    preserve: ALL
  - collection: state.patient
    preserve: ALL
  named_invariants:
  - name: Agent did not create, cancel, or modify appointments
    ref: invariant[0]
    severity: high
  - name: Agent did not modify prescriptions
    ref: invariant[1]
    severity: high
  - name: Agent did not send unsolicited messages or reply to any message
    ref: invariant[2]
    severity: high
  - name: Agent did not modify immunization records
    ref: invariant[3]
    severity: medium
  - name: Agent did not modify lab results
    ref: invariant[4]
    severity: high
  - name: Agent did not touch insurance claims
    ref: invariant[5]
    severity: critical
  - name: Agent did not touch referrals
    ref: invariant[6]
    severity: high
  - name: Agent did not modify pharmacies
    ref: invariant[7]
    severity: medium
  - name: Agent did not modify providers
    ref: invariant[8]
    severity: medium
  - name: Agent applied the new-card insurance and contact details (not the stale superseded card)
    ref: update[0]
    severity: critical
secondary_primitives: []
