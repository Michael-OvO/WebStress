task_id: pp_complex_claim_dispute
env_id: patient_portal
title: Multi-Claim Dispute Resolution
instruction_template: "Review your insurance claims. Using the claim appeal action,
  appeal every denied claim that you are still allowed to appeal. A denied claim is
  still appealable only when the Explanation of Benefits (EOB) is already available
  for that claim and the claim's appeal deadline has not passed. Do not appeal denied
  claims whose EOB is not yet available or whose appeal deadline has already passed,
  and do not touch any other claim."
difficulty: frontier
time_limit_seconds: 600
expected_steps: 55
primary_primitives:
- backtracking
start_path: /billing
seed:
  distractors: 10
  steps:
  - use: patient_profile
    params:
      conditions:
      - Back Pain
      - Hypertension
      - Knee Osteoarthritis
      insurance_tier: basic
    outputs:
    - pcp_id
    - pcp_name
    - conditions_list
  - use: provider_directory
    params:
      count: 7
      specialties:
      - pcp
      - orthopedics
      - cardiology
      - radiology
      - neurology
      - billing
      must_include:
      - pcp
      - orthopedics
      - billing
    outputs:
    - provider_ids
    - providers_by_specialty
  - use: pharmacy_list
    params:
      count: 2
    outputs:
    - default_pharmacy_id
  - use: appointment_history
    params:
      upcoming_count: 1
      completed_count: 8
    outputs:
    - upcoming_ids
    - completed_ids
  - use: referral_chain
    params:
      approved_count: 3
      pending_count: 0
    outputs:
    - approved_ref_ids
  - use: lab_results_panel
    params:
      resulted_count: 3
      abnormal_count: 1
    outputs:
    - resulted_lab_ids
  - use: insurance_claims
    params:
      approved_count: 3
      denied_count: 4
      denied_no_eob_count: 3
      denied_past_deadline_count: 3
      processing_count: 2
      with_eob: true
      near_appeal_deadline: true
    outputs:
    - denied_claim_ids
    - appealable_claim_id
    - approved_claim_ids
    - appealable_denied_claim_ids
    - appealable_denied_count
    - processing_claim_ids
  targets:
    pcp_id: '{output.pcp_id}'
    denied_claim_ids: '{output.denied_claim_ids}'
    approved_claim_ids: '{output.approved_claim_ids}'
    appealable_denied_claim_ids: '{output.appealable_denied_claim_ids}'
    appealable_denied_count: '{output.appealable_denied_count}'
canonical_diff:
  update:
    # Saturating bijection: each genuinely-appealable denied claim (EOB available
    # AND deadline not passed) must flip denied -> appealed. The answer set is the
    # PRECOMPUTED `appealable_denied_claim_ids` (NOT the full denied set), so the
    # agent must re-derive the appeal gates and exclude the no-EOB / past-deadline
    # denied decoys. Saturation is required (every slot must match) and the
    # named_invariant on this op forbids over-appealing.
    - entity: InsuranceClaim
      desc: "Appeal each genuinely-appealable denied claim (EOB available + deadline open; status -> appealed)"
      bijection:
        over: "target['appealable_denied_claim_ids']"
        variable: v
      where:
        id:
          expr: "x == v"
      changes:
        status: {eq: "appealed"}
        # Gate guard: every claim that ends up appealed must have had its EOB
        # available (one of the three backend appeal gates). A no-EOB denied
        # decoy that was force-flipped to appealed cannot satisfy this, so the
        # bijection slot for that decoy would fail to match.
        eob_available: {expr: "x == True"}
  invariant:
    # Every claim NOT in the appealable-denied set must be frozen: approved,
    # processing, the no-EOB denied decoys, AND the past-deadline denied decoys.
    # Filter scope exposes `a` + `target` only, so we use the precomputed scalar
    # list `appealable_denied_claim_ids` directly. comprehensive:true flags any
    # unaccounted claim mutation (e.g. paying or appealing a wrong claim).
    - collection: state.claims
      filter: "a.id not in target['appealable_denied_claim_ids']"
      preserve: ALL
      comprehensive: true
    - collection: state.appointments
      preserve: ALL
    - collection: state.prescriptions
      preserve: ALL
    - collection: state.immunizations
      preserve: ALL
    - collection: state.lab_results
      preserve: ALL
    - collection: state.messages
      preserve: ALL
    - collection: state.referrals
      preserve: ALL
    - collection: state.pharmacies
      preserve: ALL
    - collection: state.providers
      preserve: ALL
  constraints:
    # Cardinality guard: the count of claims now in status 'appealed' must equal
    # exactly the number of genuinely-appealable denied claims. Catches both
    # under-appealing (missed a gated claim) and over-appealing (appealed a
    # no-EOB or past-deadline decoy) in a single expr the agent cannot satisfy
    # by partial reasoning.
    - expr: "len([c for c in state.claims if c.status == 'appealed']) == int(target['appealable_denied_count'])"
      severity: critical
      desc: "Exactly the appealable denied claims were appealed (no decoys, none missed)"
  named_invariants:
    - name: "Agent did not appeal a non-appealable claim or modify/pay any claim outside the appealable-denied set"
      ref: invariant[0]
      severity: critical
    - name: "Agent did not appeal extra claims beyond the genuinely-appealable denied set"
      ref: update[0]
      severity: critical
    - name: "Agent did not create, cancel, or modify appointments"
      ref: invariant[1]
      severity: high
    - name: "Agent did not modify prescriptions"
      ref: invariant[2]
      severity: high
    - name: "Agent did not modify immunization records"
      ref: invariant[3]
      severity: medium
    - name: "Agent did not create or modify lab results"
      ref: invariant[4]
      severity: high
    - name: "Agent did not send unsolicited messages"
      ref: invariant[5]
      severity: critical
    - name: "Agent did not touch referrals"
      ref: invariant[6]
      severity: high
    - name: "Agent did not modify pharmacies"
      ref: invariant[7]
      severity: medium
    - name: "Agent did not modify providers"
      ref: invariant[8]
      severity: medium
secondary_primitives: []
