task_id: lms_module_quiz_unlock
env_id: lms
title: Complete a Locked Module Chain to Unlock the Capstone Project
instruction_template: >-
  In {target.course_code}, the modules form a strict prerequisite chain. Module 1
  is already complete. Complete Modules 2, 3, 4, and 5 in order. Finish every content
  item in a module before marking that module done, and only start the next module
  once the previous one is marked done. Completing Module 5 must leave Module 6
  unlocked with status available so the capstone project becomes accessible. Do not
  mark Module 6 or Module 7 done, and do not touch any module outside this chain.
  Then verify Module 6 is accessible.
difficulty: expert
time_limit_seconds: 420
expected_steps: 28
primary_primitives:
- planning
start_path: /courses
seed:
  distractors: 1
  steps:
  - use: student_profile
    params: {}
    outputs:
    - student_id
  - use: course_catalog
    params:
      count: 3
      must_include:
      - CS101
    outputs:
    - course_ids
    - course_code
    - target_course_id
  - use: enrollment_set
    params: {}
    outputs:
    - enrollment_ids
  - use: assignment_battery
    params:
      per_course_count: 5
      graded_fraction: 0.4
    outputs:
    - assignment_ids
  - use: module_sequence
    params:
      count: 7
      chain_type: linear
      completed_count: 1
      content_items_per_module: 4
    outputs:
    - module_ids
    - next_available_module_id
    - first_locked_module_id
  targets:
    course_code: '{output.course_code}'
    target_course_id: '{output.target_course_id}'
    next_available_module_id: '{output.next_available_module_id}'
    first_locked_module_id: '{output.first_locked_module_id}'
    module_ids: '{output.module_ids}'
    modules_to_complete: '{output.module_ids[1]},{output.module_ids[2]},{output.module_ids[3]},{output.module_ids[4]}'
    final_unlocked_module_id: '{output.module_ids[5]}'
    terminal_locked_module_id: '{output.module_ids[6]}'
canonical_diff:
  update:
  - entity: Module
    desc: Complete Modules 2-5 in order after finishing every content item in each
    bijection:
      over: "target['modules_to_complete'].split(',')"
      variable: v
    where:
      id:
        expr: "x == v"
    changes:
      status:
        eq: completed
      content_items:
        expr: "all(item.get('completed') is True for item in x) and len(x) >= 4"
    weight: 2.0
  - entity: Module
    desc: Completing Module 5 leaves Module 6 unlocked but not completed
    where:
      id:
        expr: "x == target['final_unlocked_module_id']"
    changes:
      status:
        eq: available
    weight: 1.0
  invariant:
  - collection: state.modules
    filter: "a.id not in target['module_ids'].split(',')[1:6]"
    preserve: ALL
    comprehensive: true
    weight: 1.0
  - collection: state.modules
    filter: "a.id == target['terminal_locked_module_id']"
    preserve: ALL
    weight: 1.0
  - collection: state.courses
    preserve: ALL
    weight: 1.0
  - collection: state.enrollments
    preserve: ALL
    weight: 1.0
  - collection: state.assignments
    preserve: ALL
    weight: 1.0
  - collection: state.discussions
    preserve: ALL
    weight: 1.0
  - collection: state.discussion_posts
    preserve: ALL
    weight: 1.0
  - collection: state.peer_reviews
    preserve: ALL
    weight: 1.0
  - collection: state.announcements
    preserve: ALL
    weight: 1.0
  - collection: state.grades
    preserve: ALL
    weight: 1.0
  - collection: state.calendar_events
    preserve: ALL
  - collection: state.sent_messages
    preserve: ALL
  - collection: state.student
    preserve: ALL
  constraints:
  - desc: Module 6 is unlocked but was not completed by the agent
    expr: "any(m.id == target['final_unlocked_module_id'] and m.status == 'available' for m in state.modules)"
    severity: critical
  - desc: Module 7 remains locked
    expr: "any(m.id == target['terminal_locked_module_id'] and m.status == 'locked' for m in state.modules)"
    severity: high
  - desc: Agent did not send messages
    expr: "len(state.sent_messages) == 0"
    severity: medium
  named_invariants:
  - name: Agent completed Modules 2 through 5 in the chain
    ref: update[0]
    severity: critical
  - name: Agent left Module 6 unlocked
    ref: update[1]
    severity: high
  - name: Agent did not modify modules outside the target chain
    ref: invariant[0]
    severity: high
  - name: Agent did not complete or unlock the terminal locked module
    ref: invariant[1]
    severity: critical
  - name: Agent did not modify course records
    ref: invariant[2]
    severity: medium
  - name: Agent did not drop or alter enrollments
    ref: invariant[3]
    severity: high
  - name: Agent did not modify assignments
    ref: invariant[4]
    severity: medium
  - name: Agent did not modify discussions
    ref: invariant[5]
    severity: medium
  - name: Agent did not create or edit discussion posts
    ref: invariant[6]
    severity: medium
  - name: Agent did not alter peer reviews
    ref: invariant[7]
    severity: medium
  - name: Agent did not modify announcements
    ref: invariant[8]
    severity: medium
  - name: Agent did not modify grades
    ref: invariant[9]
    severity: high
secondary_primitives: []
