task_id: lms_meet_discussion_minimums
env_id: lms
title: Meet Discussion Post and Reply Minimums
instruction_template: In the discussion "{target.discussion_title}" for {target.course_code},
  meet the minimum participation requirements. Open the discussion and read its stated
  minimum number of top-level posts and minimum number of replies. Author exactly that
  many new top-level posts, then post that many replies, with each reply attached to a
  different existing classmate post. Do not edit any existing post, do not post in any
  other discussion, and do not send any messages.
difficulty: hard
time_limit_seconds: 300
expected_steps: 16
primary_primitives:
- patience
start_path: /courses
seed:
  distractors: 1
  steps:
  - use: student_profile
    params: {}
    outputs:
    - student_id
  - use: course_catalog
    params:
      count: 3
    outputs:
    - course_ids
    - course_codes
  - use: enrollment_set
    params: {}
    outputs:
    - enrollment_ids
  - use: discussion_forums
    params:
      count: 4
      posts_per: 5
      target_min_posts: 2
      target_min_replies: 2
    outputs:
    - discussion_ids
    - target_discussion_id
    - target_discussion_title
    - target_course_code
    - target_min_posts
    - target_min_replies
    - reply_parent_post_ids
    - target_top_level_post_ids
  targets:
    discussion_title: '{output.target_discussion_title}'
    course_code: '{output.target_course_code}'
    target_discussion_id: '{output.target_discussion_id}'
    target_min_posts: '{output.target_min_posts}'
    target_min_replies: '{output.target_min_replies}'
    reply_parent_post_ids: '{output.reply_parent_post_ids}'
    target_top_level_post_ids: '{output.target_top_level_post_ids}'
canonical_diff:
  create:
    - entity: DiscussionPost
      desc: Create the first new top-level post in the target discussion
      properties:
        discussion_id:
          expr: "x == target['target_discussion_id']"
        author_id:
          expr: "x == state.student.id"
        author_name:
          expr: "x == state.student.name"
        body:
          length:
            expr: "x >= 1"
        parent_post_id:
          eq: null
        timestamp:
          expr: "x >= session_start"
        updated_at:
          eq: null
        is_anonymous:
          eq: false
    - entity: DiscussionPost
      desc: Create the second new top-level post in the target discussion
      properties:
        discussion_id:
          expr: "x == target['target_discussion_id']"
        author_id:
          expr: "x == state.student.id"
        author_name:
          expr: "x == state.student.name"
        body:
          length:
            expr: "x >= 1"
        parent_post_id:
          eq: null
        timestamp:
          expr: "x >= session_start"
        updated_at:
          eq: null
        is_anonymous:
          eq: false
    - entity: DiscussionPost
      desc: Create one reply attached to each distinct required classmate post
      bijection:
        over: "[pid.strip() for pid in target['reply_parent_post_ids'].split(',') if pid.strip()]"
        variable: v
      properties:
        discussion_id:
          expr: "x == target['target_discussion_id']"
        author_id:
          expr: "x == state.student.id"
        author_name:
          expr: "x == state.student.name"
        body:
          length:
            expr: "x >= 1"
        parent_post_id:
          expr: "x == v"
        timestamp:
          expr: "x >= session_start"
        updated_at:
          eq: null
        is_anonymous:
          eq: false
  invariant:
    - collection: state.discussion_posts
      filter: "a.discussion_id != target['target_discussion_id']"
      preserve: ALL
      comprehensive: true
      weight: 1.0
    - collection: state.discussions
      preserve: ALL
      weight: 1.0
    - collection: state.courses
      preserve: ALL
      weight: 1.0
    - collection: state.enrollments
      preserve: ALL
      weight: 1.0
    - collection: state.assignments
      preserve: ALL
      weight: 1.0
    - collection: state.modules
      preserve: ALL
      weight: 1.0
    - collection: state.peer_reviews
      preserve: ALL
      weight: 1.0
    - collection: state.announcements
      preserve: ALL
      weight: 1.0
    - collection: state.grades
      preserve: ALL
      weight: 1.0
    - collection: state.calendar_events
      preserve: ALL
      weight: 1.0
    - collection: state.sent_messages
      preserve: ALL
      weight: 1.0
    - collection: state.student
      preserve: ALL
  constraints:
  - desc: Agent did not send messages
    expr: "len(state.sent_messages) == 0"
    severity: medium
  - desc: Agent did not edit any existing discussion post
    expr: "all(p.updated_at is None for p in state.discussion_posts)"
    severity: high
  - desc: Student met exactly the stated post and reply minimums in the target discussion
    expr: "len([p for p in state.discussion_posts if p.discussion_id == target['target_discussion_id'] and p.author_id == state.student.id and p.parent_post_id is None]) == int(target['target_min_posts']) and len([p for p in state.discussion_posts if p.discussion_id == target['target_discussion_id'] and p.author_id == state.student.id and p.parent_post_id is not None]) == int(target['target_min_replies'])"
    severity: high
  - desc: Each new reply attaches to a distinct existing classmate post
    expr: "len({p.parent_post_id for p in state.discussion_posts if p.discussion_id == target['target_discussion_id'] and p.author_id == state.student.id and p.parent_post_id is not None}) == int(target['target_min_replies'])"
    severity: high
  named_invariants:
    - name: Agent did not post in non-target discussions
      ref: invariant[0]
      severity: critical
    - name: Agent did not modify discussions
      ref: invariant[1]
      severity: medium
    - name: Agent did not modify course records
      ref: invariant[2]
      severity: medium
    - name: Agent did not drop or alter enrollments
      ref: invariant[3]
      severity: high
    - name: Agent did not modify assignments
      ref: invariant[4]
      severity: medium
    - name: Agent did not modify modules
      ref: invariant[5]
      severity: medium
    - name: Agent did not alter peer reviews
      ref: invariant[6]
      severity: medium
    - name: Agent did not modify announcements
      ref: invariant[7]
      severity: medium
    - name: Agent did not modify grades
      ref: invariant[8]
      severity: high
    - name: Agent did not modify calendar events
      ref: invariant[9]
      severity: low
    - name: Agent did not send messages
      ref: invariant[10]
      severity: medium
secondary_primitives: []
